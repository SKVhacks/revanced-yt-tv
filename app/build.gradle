plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myyt.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.myyt.tv'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.9'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'   // 32-bit ARM boxes (e.g. Airtel Xstream) and 64-bit ARM TVs
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // sideloaded over ADB only
        }
    }

    androidResources {
        noCompress 'dat'   // engine.dat is read straight from the APK
    }

    dependencies {
        // Document-start scripts: the scriptlets must run before YouTube's own code.
        implementation 'androidx.webkit:webkit:1.12.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
