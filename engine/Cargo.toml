[package]
name = "myyt_adblock"
version = "0.1.0"
edition = "2021"

[lib]
name = "myyt_adblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = { version = "0.21", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
