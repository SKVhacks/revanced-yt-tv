name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the APK to a release when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # The ad-block engine (Brave's adblock-rust over JNI), built from engine/ for 32- and 64-bit ARM.
      - name: Rust toolchain
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Build the engine library
        working-directory: engine
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t armeabi-v7a -t arm64-v8a --platform 26 -o ../app/src/main/jniLibs build --release --lib

      # Same key as the copy already installed, so the APK installs as an update and the YouTube sign-in is kept.
      # Without the secret (forks, pull requests) Gradle signs with a fresh debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KEYDIR="$RUNNER_TEMP/android-user"
            mkdir -p "$KEYDIR"
            echo "$KEYSTORE_B64" | base64 -d > "$KEYDIR/debug.keystore"
            echo "ANDROID_USER_HOME=$KEYDIR" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$KEYDIR/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 is not set: this APK cannot update an existing install."
          fi

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the signing key
        if: env.KEYSTORE_FILE != ''
        run: |
          WANT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass android | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          GOT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          [ "$WANT" = "$GOT" ] || { echo "::error::APK signed with $GOT, expected $WANT"; exit 1; }

      - name: Name the APK
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "ReVanced-YT-TV-${VERSION}.apk"
          unzip -l "ReVanced-YT-TV-${VERSION}.apk" | grep -E "libmyyt_adblock.so|engine.dat"

      - uses: actions/upload-artifact@v5
        with:
          name: ReVanced-YT-TV-apk
          path: ReVanced-YT-TV-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReVanced-YT-TV-*.apk
